# Release automation (release-plz): opens a "release PR" with version bumps
# and changelog entries on every push to main, and publishes to crates.io
# when that PR is merged. Requires `CARGO_REGISTRY_TOKEN` repository secret.
# Docs: https://release-plz.ieni.dev/docs/github/quickstart

name: Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (no publish, no release PR)"
        required: false
        default: "false"

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: release-plz
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
          dry_run: ${{ inputs.dry-run == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
