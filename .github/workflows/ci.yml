name: Rust CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check_and_test:
    name: Check & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The slowest healthy leg (Windows) takes about 30 minutes. The limit counts
    # run time only, but it keeps a stuck leg from holding the PR for six hours.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation (all crates)
        run: cargo check --workspace --all-targets --all-features

      - name: Run Clippy (all crates)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests (all crates)
        run: cargo test --workspace --all-features --release

      - name: Check visualization examples compile
        run: cargo check --examples --features visualization

  msrv:
    name: MSRV 1.95
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust MSRV toolchain
        uses: dtolnay/rust-toolchain@1.95

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-

      - name: Check compilation with MSRV
        run: cargo check --workspace --all-targets --all-features

      - name: Run tests with MSRV
        run: cargo test --workspace --all-features --release
