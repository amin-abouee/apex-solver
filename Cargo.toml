[workspace]
resolver = "2"
members = [
    "crates/apex-manifolds",
    "crates/apex-io",
    "crates/apex-camera-models",
]

[workspace.package]
authors = ["Amin Abouee <amin.abouee@gmail.com>"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/amin-abouee/apex-solver"
homepage = "https://github.com/amin-abouee/apex-solver"
rust-version = "1.93"

[workspace.dependencies]
apex-manifolds = { path = "crates/apex-manifolds", version = "0.3.0" }
apex-io = { path = "crates/apex-io", version = "0.3.0" }
apex-camera-models = { path = "crates/apex-camera-models", version = "0.3.0" }

# External dependencies (shared versions)
slotmap = "1.0"
nalgebra = { version = "0.33" }
faer = { version = "0.24", features = ["sparse"] }
# faer's numeric sparse kernels take a `MemStack` scratch, but faer keeps
# `MemStack` crate-private; dyn-stack is faer's own support crate (same version
# already resolved in the lockfile), so we depend on it directly.
dyn-stack = "0.13"
rayon = "1.12"
thiserror = "2.0.18"
rand = "0.9.4"
smallvec = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4.6", features = ["derive"] }
chrono = "0.4"
colored = "2.2"
num_cpus = "1.17"
rerun = { version = "0.26.2", features = ["sdk"] }
ureq = "2.12"
bzip2 = "0.5"
flate2 = "1"
tar = "0.4"
toml = "0.8"

# rosbag optional dependencies
serde_yaml = "0.9"
byteorder  = "1.5"
bytes      = "1.11"
hex        = "0.4"
image      = "0.25"
rusqlite   = { version = "0.31", features = ["bundled"] }
zstd       = "0.13"
mcap       = "0.8"
lz4_flex   = { version = "0.11", default-features = false, features = ["std", "safe-decode", "safe-encode"] }

# DDS support
rustdds = "0.10"
tokio   = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
futures = "0.3"

# Dev dependencies
criterion = "0.6.0"
tempfile = "3.27"
factrs = "0.2.0"
tiny-solver = "0.17"
csv = "1.4"

[workspace.lints.rust]
# Neither this crate nor its workspace members contain any unsafe code today,
# so forbidding it costs nothing and keeps it that way.
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
# Library code must log through `tracing`, never print directly. CLI binaries
# in crates/apex-io/bin/ and a few test diagnostics opt out file-by-file, since
# user-facing console output (and --nocapture test notes) are their job.
print_stdout = "deny"
print_stderr = "deny"

# apex-solver package (root crate)
[package]
name = "apex-solver"
version = "1.4.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/apex-solver"
rust-version.workspace = true
description = "High-performance nonlinear least squares optimization with Lie group support for SLAM and bundle adjustment"
readme = "README.md"
keywords = ["optimization", "slam", "computer-vision", "robotics", "nonlinear"]
categories = ["algorithms", "science", "mathematics"]

exclude = [
    "crates/",
    "data/*",
    "profiles/*",
    "output/*",
    "doc/**/*.pdf",
]

# Build docs.rs with every feature so the `visualization` API is documented.
[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "pose_graph_g2o"
path = "bin/pose_graph_g2o.rs"
required-features = ["cli"]

[[bin]]
name = "bundle_adjustment"
path = "bin/bundle_adjustment.rs"
required-features = ["cli", "apex-io/download"]

[[example]]
name = "compare_solvers"
required-features = ["cli"]

[[example]]
name = "compare_optimizers"
required-features = ["cli"]

[[example]]
name = "loss_function_comparison"
required-features = ["cli"]

[[example]]
name = "visualize_graph_file"
required-features = ["visualization", "cli"]

[[example]]
name = "visualize_optimization"
required-features = ["visualization", "cli"]

[features]
default = ["cli", "download"]
visualization = ["dep:rerun", "apex-io/visualization"]
# CLI argument parsing for bins/examples. Opt-out with `--no-default-features`.
cli = ["dep:clap"]
# ROS1/ROS2 bag I/O pass-through (opt-in; pulls bundled SQLite + codecs).
rosbag = ["apex-io/rosbag"]
# Dataset download helpers pass-through (on by default).
download = ["apex-io/download"]

[dependencies]
apex-manifolds.workspace = true
apex-camera-models.workspace = true

# External dependencies
slotmap.workspace = true
nalgebra.workspace = true
faer.workspace = true
dyn-stack.workspace = true
rayon.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
smallvec.workspace = true

# Path + version duplicated from [workspace.dependencies] on purpose: inheriting
# via `workspace = true` forbids `default-features = false`, which is what makes
# `--no-default-features` truly lean (no ureq/clap unless asked). Keep the two
# version strings in sync on release.
[dependencies.apex-io]
path = "crates/apex-io"
version = "0.3.0"
default-features = false

[dependencies.rerun]
workspace = true
optional = true

[dependencies.clap]
workspace = true
optional = true

[dev-dependencies]
criterion.workspace = true
rand.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
factrs.workspace = true
tiny-solver.workspace = true
csv.workspace = true
serde.workspace = true

[[bench]]
name = "odometry_pose_benchmark"
harness = false

[[bench]]
name = "bundle_adjustment_benchmark"
harness = false

[lints]
workspace = true

[profile.dev]
split-debuginfo = "unpacked"
debug = 1

# Tests run under the release profile: debug builds are ~50x slower on the
# large-graph integration tests. Trade-off: `debug_assert!` checks and integer
# overflow detection are NOT exercised by `cargo test` — run a debug
# `cargo run` / `cargo check` when debugging correctness patterns.
[profile.test]
inherits = "release"
split-debuginfo = "unpacked"
debug = 1

[profile.profiling]
inherits = "release"
debug = true

[profile.release]
opt-level = 3
lto = "thin"

[[bench]]
name = "micro_kernels"
harness = false
