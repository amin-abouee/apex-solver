[workspace]
resolver = "2"
members = [
    "crates/apex-manifolds",
    "crates/apex-io",
    "crates/apex-camera-models",
]

[workspace.package]
authors = ["Amin Abouee <amin.abouee@gmail.com>"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/amin-abouee/apex-solver"
homepage = "https://github.com/amin-abouee/apex-solver"
rust-version = "1.85"

[workspace.dependencies]
apex-manifolds = { path = "crates/apex-manifolds", version = "0.3.0" }
apex-io = { path = "crates/apex-io", version = "0.3.0" }
apex-camera-models = { path = "crates/apex-camera-models", version = "0.3.0" }

# External dependencies (shared versions)
slotmap = "1.0"
nalgebra = { version = "0.33" }
faer = { version = "0.24", features = ["sparse"] }
rayon = "1.12"
thiserror = "2.0.18"
rand = "0.9.4"
memmap2 = "0.9"
smallvec = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4.6", features = ["derive"] }
chrono = "0.4"
colored = "2.2"
num_cpus = "1.17"
rerun = { version = "0.26.2", features = ["sdk"] }
# CUDA bindings for the optional GPU linear solvers (`cuda` feature).
# `fallback-dynamic-loading` resolves the CUDA libraries at runtime instead of
# linking at build time, so this compiles on machines with no CUDA toolkit.
cudarc = { version = "0.19", default-features = false, features = [
    "std",
    "driver",
    "cublas",
    "cublaslt",
    "cusparse",
    "cusolver",
    "fallback-dynamic-loading",
] }
ureq = "2.12"
bzip2 = "0.5"
toml = "0.8"

# rosbag optional dependencies
serde_yaml = "0.9"
byteorder  = "1.5"
bytes      = "1.11"
hex        = "0.4"
image      = "0.25"
rusqlite   = { version = "0.31", features = ["bundled"] }
zstd       = "0.13"
mcap       = "0.8"
lz4_flex   = { version = "0.11", default-features = false, features = ["std", "safe-decode", "safe-encode"] }

# DDS support
rustdds = "0.10"
tokio   = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
futures = "0.3"

# Dev dependencies
criterion = "0.6.0"
tempfile = "3.27"
factrs = "0.2.0"
tiny-solver = "0.17"
csv = "1.4"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# apex-solver package (root crate)
[package]
name = "apex-solver"
version = "1.4.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/apex-solver"
rust-version.workspace = true
description = "High-performance nonlinear least squares optimization with Lie group support for SLAM and bundle adjustment"
readme = "README.md"
keywords = ["optimization", "slam", "computer-vision", "robotics", "nonlinear"]
categories = ["algorithms", "science", "mathematics"]

exclude = [
    "crates/",
    "data/*",
    "profiles/*",
    "output/*",
    "doc/*.pdf",
]

# Build docs.rs with `visualization` so that API is documented. Deliberately not
# `all-features`: the `cuda` feature pulls in cudarc, and docs.rs builders have
# no CUDA installation.
[package.metadata.docs.rs]
features = ["visualization"]

[[bin]]
name = "pose_graph_g2o"
path = "bin/pose_graph_g2o.rs"

[[bin]]
name = "bundle_adjustment"
path = "bin/bundle_adjustment.rs"

[[example]]
name = "compare_solvers"

[[example]]
name = "visualize_graph_file"
required-features = ["visualization"]

[[example]]
name = "visualize_optimization"
required-features = ["visualization"]

[features]
default = []
visualization = ["dep:rerun", "apex-io/visualization"]
# GPU linear solvers backed by NVIDIA cuSOLVER. Requires an NVIDIA GPU and
# driver at *runtime*; builds anywhere thanks to cudarc's dynamic loading.
#
# The pinned `cuda-12060` selects which cuSOLVER API declarations are compiled —
# not which driver is used, since symbols are resolved at runtime. The routines
# used here (cusolverSpDcsrlsvchol/qr) have existed since CUDA 7, so this baseline
# is safe across toolkits. Override without editing this file by exporting
# `CUDARC_CUDA_VERSION=12.4` (cudarc's build.rs gives the env var priority), or
# use the `cuda-detect` feature to match the locally installed toolkit.
cuda = ["dep:cudarc", "cudarc/cuda-12060"]
cuda-detect = ["dep:cudarc", "cudarc/cuda-version-from-build-system"]

[dependencies]
apex-manifolds.workspace = true
apex-io.workspace = true
apex-camera-models.workspace = true

# External dependencies
slotmap.workspace = true
nalgebra.workspace = true
faer.workspace = true
rayon.workspace = true
thiserror.workspace = true
rand.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
colored.workspace = true
num_cpus.workspace = true
chrono.workspace = true
ureq.workspace = true
bzip2.workspace = true
smallvec.workspace = true

[dependencies.rerun]
workspace = true
optional = true

[dependencies.cudarc]
workspace = true
optional = true

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
factrs.workspace = true
tiny-solver.workspace = true
csv.workspace = true
serde.workspace = true

[[bench]]
name = "odometry_pose_benchmark"
harness = false

[[bench]]
name = "bundle_adjustment_benchmark"
harness = false

[lints]
workspace = true

[profile.dev]
split-debuginfo = "unpacked"
debug = 1

[profile.test]
inherits = "release"
split-debuginfo = "unpacked"
debug = 1

[profile.profiling]
inherits = "release"
debug = true

[profile.release]
opt-level = 3
lto = "thin"
