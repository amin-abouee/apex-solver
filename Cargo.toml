[workspace]
resolver = "2"
members = [
    "crates/apex-manifolds",
    "crates/apex-io",
    "crates/apex-camera-models",
]

[workspace.package]
authors = ["Amin Abouee <amin.abouee@gmail.com>"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/amin-abouee/apex-solver"
homepage = "https://github.com/amin-abouee/apex-solver"
rust-version = "1.95"

[workspace.dependencies]
apex-manifolds = { path = "crates/apex-manifolds", version = "0.5.0" }
apex-io = { path = "crates/apex-io", version = "0.5.0" }
apex-camera-models = { path = "crates/apex-camera-models", version = "0.5.0" }

# External dependencies (shared versions)
slotmap = "1.1"
nalgebra = { version = "0.35" }
faer = { version = "0.24", features = ["sparse"] }
# faer's numeric sparse kernels take a `MemStack` scratch, but faer keeps
# `MemStack` crate-private; dyn-stack is faer's own support crate (same version
# already resolved in the lockfile), so we depend on it directly.
dyn-stack = "0.13"
rayon = "1.12"
thiserror = "2.0.21"
rand = "0.10.3"
smallvec = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4.6", features = ["derive"] }
chrono = "0.4"
num_cpus = "1.17"
rerun = { version = "0.26.2", features = ["sdk"] }
ureq = "3.5"
bzip2 = "0.6"
flate2 = "1"
tar = "0.4"
toml = "1.2"

# rosbag optional dependencies
serde_norway = "0.9.42"
byteorder  = "1.5"
bytes      = "1.12"
hex        = "0.4"
image      = "0.25"
rusqlite   = { version = "0.41", features = ["bundled"] }
zstd       = "0.14"
mcap       = "0.26"
md5        = "0.8"
crc32fast  = "1.5"
lz4_flex   = { version = "0.14", default-features = false, features = ["std", "safe-decode", "safe-encode", "frame"] }

# DDS support
rustdds = "0.15"
tokio   = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
futures = "0.3"

# Dev dependencies
criterion = "0.8.2"
tempfile = "3.27"
factrs = "0.3.0"
tiny-solver = "0.18"
csv = "1.4"

[workspace.lints.rust]
# Neither this crate nor its workspace members contain any unsafe code today,
# so forbidding it costs nothing and keeps it that way.
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
# Library code must log through `tracing`, never print directly. CLI binaries
# in crates/apex-io/bin/ and a few test diagnostics opt out file-by-file, since
# user-facing console output (and --nocapture test notes) are their job.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# apex-solver package (root crate)
[package]
name = "apex-solver"
version = "1.6.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/apex-solver"
rust-version.workspace = true
description = "High-performance nonlinear least squares optimization with Lie group support for SLAM and bundle adjustment"
readme = "README.md"
keywords = ["optimization", "slam", "computer-vision", "robotics", "nonlinear"]
categories = ["algorithms", "science", "mathematics", "science::robotics"]

# Keep the published crate to what users build and read: sources, benches,
# examples, tests, the cookbook. CI, project-management and audit files stay
# in the repository.
exclude = [
    "crates/",
    "data/*",
    "profiles/*",
    "output/*",
    "doc/**/*.pdf",
    ".github/",
    "scripts/",
    "plan/",
    "deny.toml",
    "clippy.toml",
    "release-plz.toml",
]

# Build docs.rs with every feature so the `visualization` API is documented.
[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "pose_graph_g2o"
path = "bin/pose_graph_g2o.rs"
required-features = ["cli"]

[[bin]]
name = "bundle_adjustment"
path = "bin/bundle_adjustment.rs"
required-features = ["cli", "apex-io/download"]

# Examples: a learning path, read in order (see examples/README.md).

# Part 1 — fundamentals (synthetic, no download)
[[example]]
name = "curve_fitting"
path = "examples/fundamentals/curve_fitting.rs"

[[example]]
name = "pose_graph_2d"
path = "examples/fundamentals/pose_graph_2d.rs"

[[example]]
name = "robust_losses"
path = "examples/fundamentals/robust_losses.rs"

[[example]]
name = "uncertainty"
path = "examples/fundamentals/uncertainty.rs"

# Part 2 — choosing an optimizer and a linear solver
[[example]]
name = "optimizers"
path = "examples/solver_choices/optimizers.rs"

[[example]]
name = "linear_solvers"
path = "examples/solver_choices/linear_solvers.rs"

# Part 3 — bundle adjustment
[[example]]
name = "ba_synthetic"
path = "examples/bundle_adjustment/ba_synthetic.rs"

[[example]]
name = "ba_parameterizations"
path = "examples/bundle_adjustment/ba_parameterizations.rs"

[[example]]
name = "bal_dataset"
path = "examples/bundle_adjustment/bal_dataset.rs"

# Part 4 — incremental and sliding-window estimation
[[example]]
name = "incremental_pose_graph"
path = "examples/incremental/incremental_pose_graph.rs"

[[example]]
name = "fixed_lag_smoother"
path = "examples/incremental/fixed_lag_smoother.rs"

[[example]]
name = "sliding_window_ba"
path = "examples/incremental/sliding_window_ba.rs"

# Tools — Rerun visualization
[[example]]
name = "visualize_optimization"
path = "examples/visualization/visualize_optimization.rs"
required-features = ["visualization", "cli"]

[[example]]
name = "visualize_graph_file"
path = "examples/visualization/visualize_graph_file.rs"
required-features = ["visualization", "cli"]

[features]
default = ["cli", "download"]
visualization = ["dep:rerun", "apex-io/visualization"]
# CLI argument parsing for bins/examples. Opt-out with `--no-default-features`.
cli = ["dep:clap"]
# ROS1/ROS2 bag I/O pass-through (opt-in; pulls bundled SQLite + codecs).
rosbag = ["apex-io/rosbag"]
# Meta VRS (Project Aria) reader/writer pass-through (opt-in; reuses zstd/lz4).
vrs = ["apex-io/vrs"]
# Dataset download helpers pass-through (on by default).
download = ["apex-io/download"]

[dependencies]
apex-manifolds.workspace = true
apex-camera-models.workspace = true

# External dependencies
slotmap.workspace = true
nalgebra.workspace = true
faer.workspace = true
dyn-stack.workspace = true
rayon.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
smallvec.workspace = true

# Path + version duplicated from [workspace.dependencies] on purpose: inheriting
# via `workspace = true` forbids `default-features = false`, which is what makes
# `--no-default-features` truly lean (no ureq/clap unless asked). Keep the two
# version strings in sync on release.
[dependencies.apex-io]
path = "crates/apex-io"
version = "0.5.0"
default-features = false

[dependencies.rerun]
workspace = true
optional = true

[dependencies.clap]
workspace = true
optional = true

[dev-dependencies]
criterion.workspace = true
rand.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
factrs.workspace = true
tiny-solver.workspace = true
csv.workspace = true
dhat = "0.3"
serde.workspace = true

[[bench]]
name = "odometry_pose_benchmark"
harness = false

[[bench]]
name = "bundle_adjustment_benchmark"
harness = false

[[bench]]
name = "odometry_benchmark"
harness = false

[[bench]]
name = "ba_benchmark"
harness = false

[[bench]]
name = "implicit_ba_benchmark"
harness = false

[lints]
workspace = true

[profile.dev]
split-debuginfo = "unpacked"
debug = 1

# Tests run under the release profile: debug builds are ~50x slower on the
# large-graph integration tests. Trade-off: `debug_assert!` checks and integer
# overflow detection are NOT exercised by `cargo test` — run a debug
# `cargo run` / `cargo check` when debugging correctness patterns.
[profile.test]
inherits = "release"
split-debuginfo = "unpacked"
debug = 1

[profile.profiling]
inherits = "release"
debug = true

[profile.release]
opt-level = 3
lto = "thin"

[[bench]]
name = "micro_kernels"
harness = false

[[bench]]
name = "window_kernels"
harness = false
