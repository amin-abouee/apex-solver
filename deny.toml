# cargo-deny configuration: license / advisory / source auditing.
# Complements `cargo audit` (see .github/workflows/audit.yml), which only
# covers RustSec advisories. Run locally with `cargo deny check`.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
]
# Copyleft and unknown licenses fail the check; add an explicit
# `[[licenses.clarify]]` / `allow` entry with justification if one appears.
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "AGPL-1.0",
    "AGPL-3.0",
    "LGPL-2.0",
    "LGPL-2.1",
    "LGPL-3.0",
]
copyleft = "deny"
allow-osi-fsf-free = "neither"
uncertain-allow-osi-fsf-free = "deny"
# Workspace crates are Apache-2.0; confidence threshold for license detection.
confidence-threshold = 0.8

[advisories]
version = 2
yanked = "deny"
unmaintained = "warn"
unsound = "warn"
# Version numbers, not advisories, are ignored here; keep the list empty and
# handle RustSec ignores in .cargo/audit.toml instead.
ignore = []

[sources]
version = 2
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
